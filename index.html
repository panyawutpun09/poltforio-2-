<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio | M.6</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, "Tahoma", sans-serif;
            min-height: 100vh;
            background: #eef9f2;
            color: #17452d;
            overflow-x: hidden;
        }

        /* =========================
           พื้นหลัง
        ========================= */

        body::before {
            content: "";
            position: fixed;

            width: 500px;
            height: 500px;

            background: #b9e8c9;
            border-radius: 50%;

            filter: blur(100px);
            opacity: 0.45;

            top: -200px;
            left: -150px;

            z-index: -1;
        }

        body::after {
            content: "";
            position: fixed;

            width: 450px;
            height: 450px;

            background: #8fd6aa;
            border-radius: 50%;

            filter: blur(110px);
            opacity: 0.3;

            bottom: -180px;
            right: -150px;

            z-index: -1;
        }

        /* =========================
           จัดการ์ดไว้ตรงกลาง
        ========================= */

        .container {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;
        }

        /* =========================
           การ์ดหลัก
        ========================= */

        .card {
            width: 100%;
            max-width: 650px;

            background: rgba(255, 255, 255, 0.96);

            border-radius: 30px;

            padding: 45px;

            text-align: center;

            border: 1px solid #d7eddf;

            box-shadow:
                0 25px 60px rgba(31, 91, 54, 0.12);
        }

        /* =========================
           รูปโปรไฟล์
        ========================= */

        .profile-photo {
            width: 125px;
            height: 125px;

            margin: 0 auto 20px;

            padding: 5px;

            border-radius: 50%;

            background: #ffffff;

            border: 4px solid #8dcea3;

            box-shadow:
                0 10px 30px rgba(31, 103, 65, 0.18);

            overflow: hidden;

            transition: all 0.3s ease;
        }

        .profile-photo img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            border-radius: 50%;

            display: block;
        }

        /* เอฟเฟกต์รูปตอนเอาเมาส์ชี้ */

        .profile-photo:hover {
            transform: scale(1.06);

            border-color: #43a967;

            box-shadow:
                0 15px 35px rgba(31, 103, 65, 0.25);
        }

        /* =========================
           หัวข้อ
        ========================= */

        .small-title {
            display: inline-block;

            padding: 7px 17px;

            border-radius: 50px;

            background: #e1f5e8;

            color: #178047;

            font-size: 12px;

            font-weight: bold;

            letter-spacing: 2px;

            margin-bottom: 15px;
        }

        h1 {
            font-size: 42px;

            color: #12452c;

            margin-bottom: 8px;
        }

        .description {
            color: #789486;

            font-size: 15px;

            margin-bottom: 30px;
        }

        /* =========================
           เมนู 5 ลิงก์
        ========================= */

        .menu {
            width: 100%;

            max-width: 480px;

            margin: auto;

            display: flex;

            flex-direction: column;

            gap: 12px;
        }

        /* =========================
           ปุ่มเมนู
        ========================= */

        .menu a {
            text-decoration: none;

            color: #17452d;

            display: flex;

            align-items: center;

            padding: 15px 18px;

            background: #f6fbf8;

            border: 1px solid #e0efe5;

            border-radius: 17px;

            transition: all 0.25s ease;
        }

        /* =========================
           ไอคอน
        ========================= */

        .icon {
            width: 45px;
            height: 45px;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #e0f5e8;

            border-radius: 14px;

            font-size: 21px;

            margin-right: 15px;
        }

        /* =========================
           ข้อความ
        ========================= */

        .text {
            text-align: left;
        }

        .text strong {
            display: block;

            font-size: 16px;

            font-weight: 600;
        }

        .text span {
            display: block;

            color: #8aa294;

            font-size: 12px;

            margin-top: 2px;
        }

        /* =========================
           ลูกศร
        ========================= */

        .arrow {
            margin-left: auto;

            font-size: 20px;

            color: #58a777;

            transition: transform 0.25s ease;
        }

        /* =========================
           เอฟเฟกต์เมนู
        ========================= */

        .menu a:hover {
            background: #e5f7eb;

            border-color: #a9daba;

            transform: translateY(-3px);

            box-shadow:
                0 10px 25px rgba(36, 126, 72, 0.12);
        }

        .menu a:hover .arrow {
            transform: translateX(5px);
        }

        /* หน้าหลัก */

        .menu a:first-child {
            background: #e3f6e9;

            border-color: #b6dfc4;
        }

        /* =========================
           Footer
        ========================= */

        .footer {
            margin-top: 28px;

            color: #9caf9f;

            font-size: 11px;

            letter-spacing: 2px;
        }

        /* =========================
           มือถือ
        ========================= */

        @media (max-width: 600px) {

            .container {
                padding: 15px;
            }

            .card {
                padding: 35px 20px;

                border-radius: 24px;
            }

            .profile-photo {
                width: 105px;
                height: 105px;
            }

            h1 {
                font-size: 34px;
            }

            .description {
                font-size: 13px;
            }

            .menu a {
                padding: 13px;
            }
        }

    </style>
</head>

<body>

    <div class="container">

            <!-- =========================

            <p class="description">

            </p>


            <!-- =========================
                 เมนู 5 ลิงก์
            ========================== -->

            <div class="menu">


                <!-- 1. หน้าหลัก -->

                <a href="index.html">

                    <div class="icon">
                        🏠
                    </div>

                    <div class="text">

                        <strong>
                            หน้าหลัก
                        </strong>

                        <span>
                            Home
                        </span>

                    </div>

                    <div class="arrow">
                        →
                    </div>

                </a>


                <!-- 2. Profile -->

                <a href="profile.html">

                    <div class="icon">
                        👤
                    </div>

                    <div class="text">

                        <strong>
                            ประวัติส่วนตัว
                        </strong>

                        <span>
                            Profile
                        </span>

                    </div>

                    <div class="arrow">
                        →
                    </div>

                </a>


                <!-- 3. Education -->

                <a href="education.html">

                    <div class="icon">
                        🎓
                    </div>

                    <div class="text">

                        <strong>
                            ประวัติการศึกษา
                        </strong>

                        <span>
                            Education
                        </span>

                    </div>

                    <div class="arrow">
                        →
                    </div>

                </a>


                <!-- 4. Award -->

                <a href="award.html">

                    <div class="icon">
                        🏆
                    </div>

                    <div class="text">

                        <strong>
                            ผลงานและรางวัล
                        </strong>

                        <span>
                            Awards
                        </span>

                    </div>

                    <div class="arrow">
                        →
                    </div>

                </a>


                <!-- 5. Contact -->

                <a href="contact.html">

                    <div class="icon">
                        ✉️
                    </div>

                    <div class="text">

                        <strong>
                            ติดต่อ
                        </strong>

                        <span>
                            Contact
                        </span>

                    </div>

                    <div class="arrow">
                        →
                    </div>

                </a>

            </div>


            <!-- =========================
                 Footer
            ========================== -->

            <div class="footer">
                PORTFOLIO • M.6
            </div>

        </div>

    </div>

</body>
</html>
