   /* =========================
   จุดแสงลอยในพื้นหลัง
========================= */

.floating-lights {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: -1;
}

.floating-lights span {
    position: absolute;

    width: 7px;
    height: 7px;

    background: #62c989;
    border-radius: 50%;

    opacity: 0.45;

    box-shadow:
        0 0 10px #62c989,
        0 0 20px #a5e8bd;

    animation: floatLight 8s infinite ease-in-out;
}

/* ตำแหน่งแต่ละจุด */

.floating-lights span:nth-child(1) {
    left: 10%;
    top: 80%;
    animation-duration: 9s;
}

.floating-lights span:nth-child(2) {
    left: 20%;
    top: 30%;
    animation-duration: 12s;
    animation-delay: 1s;
}

.floating-lights span:nth-child(3) {
    left: 35%;
    top: 75%;
    animation-duration: 10s;
    animation-delay: 2s;
}

.floating-lights span:nth-child(4) {
    left: 50%;
    top: 20%;
    animation-duration: 13s;
    animation-delay: 3s;
}

.floating-lights span:nth-child(5) {
    left: 65%;
    top: 70%;
    animation-duration: 11s;
    animation-delay: 1.5s;
}

.floating-lights span:nth-child(6) {
    left: 75%;
    top: 35%;
    animation-duration: 9s;
    animation-delay: 2.5s;
}

.floating-lights span:nth-child(7) {
    left: 88%;
    top: 80%;
    animation-duration: 12s;
    animation-delay: 4s;
}

.floating-lights span:nth-child(8) {
    left: 92%;
    top: 15%;
    animation-duration: 10s;
    animation-delay: 1s;
}

  /* =========================
   ใบไม้ในป่า 🌿
========================= */

.card {
    position: relative;
    overflow: hidden;
}

/* ใบไม้ทั้งหมด */
.forest-leaves {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
}

/* ใบไม้แต่ละใบ */
.leaf {
    position: absolute;
    font-size: 30px;
    opacity: 0.55;

    filter: drop-shadow(0 5px 8px rgba(0, 70, 30, 0.18));

    animation: leafFloat 6s ease-in-out infinite;
}

/* ตำแหน่งใบไม้ */

.leaf:nth-child(1) {
    top: 8%;
    left: 4%;
    transform: rotate(-25deg);
}

.leaf:nth-child(2) {
    top: 18%;
    left: 10%;
    font-size: 22px;
    animation-delay: 1s;
}

.leaf:nth-child(3) {
    top: 5%;
    right: 5%;
    transform: rotate(30deg);
    animation-delay: 2s;
}

.leaf:nth-child(4) {
    top: 22%;
    right: 8%;
    font-size: 24px;
    animation-delay: 3s;
}

.leaf:nth-child(5) {
    bottom: 12%;
    left: 5%;
    font-size: 27px;
    animation-delay: 1.5s;
}

.leaf:nth-child(6) {
    bottom: 5%;
    left: 13%;
    font-size: 21px;
    animation-delay: 2.5s;
}

.leaf:nth-child(7) {
    bottom: 10%;
    right: 5%;
    font-size: 32px;
    animation-delay: 3.5s;
}

.leaf:nth-child(8) {
    bottom: 22%;
    right: 11%;
    font-size: 23px;
    animation-delay: 4s;
}

/* ใบไม้ลอยเบา ๆ */

@keyframes leafFloat {

    0%, 100% {
        margin-top: 0;
        transform: rotate(-10deg);
    }

    50% {
        margin-top: -10px;
        transform: rotate(8deg);
    }
}      

/* Animation */

@keyframes floatLight {

    0% {
        transform: translate(0, 0) scale(1);
        opacity: 0.2;
    }

    25% {
        transform: translate(35px, -45px) scale(1.4);
        opacity: 0.6;
    }

    50% {
        transform: translate(-25px, -90px) scale(0.8);
        opacity: 0.3;
    }

    75% {
        transform: translate(45px, -130px) scale(1.2);
        opacity: 0.55;
    }

    100% {
        transform: translate(0, 0) scale(1);
        opacity: 0.2;
    }

}     
        * {

       body {
    font-family: Arial, "Tahoma", sans-serif;
    min-height: 100vh;
    background: #082c1b;
    color: #dff7e8;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;

    width: 700px;
    height: 700px;

    background: radial-gradient(
        circle,
        rgba(31, 180, 99, 0.55) 0%,
        rgba(31, 180, 99, 0.25) 30%,
        transparent 70%
    );

    border-radius: 50%;
    filter: blur(30px);

    top: -300px;
    left: -200px;

    z-index: -1;

    animation: greenGlow1 12s ease-in-out infinite alternate;
}

body::after {
    content: "";
    position: fixed;

    width: 650px;
    height: 650px;

    background: radial-gradient(
        circle,
        rgba(20, 130, 75, 0.5) 0%,
        rgba(20, 130, 75, 0.2) 35%,
        transparent 70%
    );

    border-radius: 50%;
    filter: blur(40px);

    bottom: -300px;
    right: -200px;

    z-index: -1;

    animation: greenGlow2 15s ease-in-out infinite alternate;
}

@keyframes greenGlow1 {
    0% {
        transform: translate(0, 0) scale(1);
    }

    50% {
        transform: translate(180px, 120px) scale(1.15);
    }

    100% {
        transform: translate(350px, 30px) scale(0.9);
    }
}

@keyframes greenGlow2 {
    0% {
        transform: translate(0, 0) scale(1);
    }

    50% {
        transform: translate(-150px, -100px) scale(1.2);
    }

    100% {
        transform: translate(-300px, 30px) scale(0.9);
    }
}

        .icon {

        /* =========================

        .arrow {

        }

        /* =========================
           เอฟเฟกต์เมนู
        ========================= */

        .menu a:hover {
            background: #e5f7eb;

            border-color: #a9daba;

            transform: translateY(-3px);

            box-shadow:
                0 10px 25px rgba(36, 126, 72, 0.12);
        }

        .menu a:hover .arrow {

        }

        /* หน้าหลัก */
